# One simulated SO-101 follower arm on a plain floor (Stage 1).
#
# Model and physics follow LeRobot's official MuJoCo env
# (huggingface.co/lerobot/so101-tabletop-mujoco): Menagerie SO-101 at the same
# commit, the arm's own physics options, 30 Hz control.
#
# All joint values here are radians in the canonical order:
#   shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll, gripper
# Gripper: -0.1745 rad = closed, +1.7453 rad = open (see docs/conventions.md).

scene: assets/scenes/arm_only.xml
physics_timestep: null    # use the model's (0.005 s), nudged to 1/210 s = 7 substeps per tick
control_hz: 30            # LeRobot SO-101 standard rate

arms:
  # Each arm's MJCF is attached under the prefix "<name>/", e.g. "main/elbow_flex".
  # A bimanual setup adds more entries here (see so101_bimanual.yaml).
  - name: main
    model: assets/robotstudio_so101/so101.xml
    mount: {pos: [0, 0, 0], quat: [1, 0, 0, 0]}

safety:
  position_margin: [0.02, 0.02, 0.02, 0.02, 0.02, 0.0]  # rad kept clear of hard limits (gripper: none)
  max_velocity: 1.5               # rad/s (scalar = same for every joint)
  max_acceleration: 6.0           # rad/s^2
  max_relative_target: null       # max rad between target and measured position (LeRobot follower option); null = off
  on_out_of_range: clip           # clip | reject
  tracking_error_warn: 0.15       # rad

poses:
  zero: [0, 0, 0, 0, 0, 0]              # calibration zero: arm extended horizontally
  # LeRobot env HOME = (0, -60, 60, 35, 0, 30) in LeRobot units (deg, gripper 0..100)
  home: [0, -1.047198, 1.047198, 0.610865, 0, 0.401426]
  rest: [0, -1.6, 1.55, 0.75, 0, 0]     # ours (no official rest pose): folded, gripper closed
