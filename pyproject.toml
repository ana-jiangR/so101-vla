[project]
name = "so101-vla"
version = "0.1.0"
description = "SO-ARM101 MuJoCo simulation, low-level control, and VLA integration"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco>=3.3,<4",
    "numpy>=2.0,<3",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
# Stage 2 (pretrained VLA). Optional, so Stage 1 installs without torch / CUDA:
#   uv sync --extra vla
vla = [
    "lerobot[smolvla]==0.6.1",
    "torch>=2.7,<2.12",       # lerobot 0.6.1's range
    "torchvision",
]

# Stage 3 + real SO-101 hardware:  uv sync --extra train
# lerobot[training] brings LeRobotDataset (datasets, pyarrow, PyAV, torchcodec) and
# lerobot-train's dependencies. mink = differential IK for the scripted expert
# (LeRobot's own RobotKinematics needs placo, which has no Windows wheels).
train = [
    "so101-vla[vla]",
    "lerobot[smolvla,training,feetech,pynput-dep]==0.6.1",   # feetech: SO-101 bus; pynput: lerobot-record keys
    "mink>=1.4,<2",
]

# Zero-shot MolmoAct2-SO100/101 (5B) with 8-bit / 4-bit weights for 8 GB GPUs:
#   uv sync --extra train --extra molmoact2
molmoact2 = [
    "so101-vla[vla]",
    "lerobot[molmoact2]==0.6.1",
    "bitsandbytes>=0.45",
]

[tool.uv.sources]
# CUDA builds of PyTorch on Windows/Linux (the default PyPI wheel on Windows is CPU-only).
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "so101_vla"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "viewer: needs an interactive display (skipped by default)",
]
